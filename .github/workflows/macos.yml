name: macOS NetGuard

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests (system Python 3.9)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests with /usr/bin/python3
        run: |
          /usr/bin/python3 --version
          cd macos && /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          for f in macos/install.sh macos/uninstall.sh macos/bin/* macos/scripts/recover.command macos/ci/integration.sh; do
            bash -n "$f"
          done
      - name: Rendered rules pass pfctl syntax check (no load)
        run: |
          for variant in "False False" "True False" "False True" "True True"; do
            set -- $variant
            /usr/bin/python3 -c "
          import sys; sys.path.insert(0, 'macos')
          from netguard import config, pfrules
          print(pfrules.render(config.validate({}), 0, 20, dns_block=$1, isolate=$2))" > /tmp/rules.conf
            echo "--- dns_block=$1 isolate=$2"; cat /tmp/rules.conf
            sudo /sbin/pfctl -n -a 'com.apple/zz.NetGuard' -f /tmp/rules.conf
          done
      - name: ClaudeGuard compatibility patch against the pinned upstream file
        run: |
          set -e
          FAKE=$(mktemp -d)
          mkdir -p "$FAKE/.local/share/ClaudeGuard/src" "$FAKE/.local/share/claude/versions"
          curl -fsSL https://raw.githubusercontent.com/ivblz/ClaudeGuard/61b61e11a4e05d86a75213abecceb13d80e8acbf/src/integrity.py -o "$FAKE/.local/share/ClaudeGuard/src/integrity.py"
          [ "$(HOME=$FAKE bash macos/patches/claudeguard/apply.sh --check)" = original ]
          HOME=$FAKE bash macos/patches/claudeguard/apply.sh
          [ "$(HOME=$FAKE bash macos/patches/claudeguard/apply.sh --check)" = patched ]
          HOME=$FAKE bash macos/patches/claudeguard/apply.sh   # idempotent
          echo '#!/bin/sh' > "$FAKE/.local/share/claude/versions/2.1.322"
          chmod +x "$FAKE/.local/share/claude/versions/2.1.322"
          HOME=$FAKE /usr/bin/python3 -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('integrity', sys.argv[1])
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          found = m.discover_real_cli()
          print('discovered:', found)
          assert found and found.endswith('/versions/2.1.322'), found" "$FAKE/.local/share/ClaudeGuard/src/integrity.py"
          HOME=$FAKE bash macos/patches/claudeguard/apply.sh --revert
          [ "$(HOME=$FAKE bash macos/patches/claudeguard/apply.sh --check)" = original ]
          HOME=$FAKE /usr/bin/python3 -c "
          import sys; sys.path.insert(0, 'macos')
          from netguard import probes
          print(probes.claudeguard_patch_state(sys.argv[1]))" "$FAKE"
      - name: Build menu bar app
        run: |
          xcrun swiftc -O -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13.0" \
            -o /tmp/NetGuard macos/app/NetGuardApp.swift -framework AppKit -framework SwiftUI
          plutil -lint macos/app/Info.plist macos/launchd/*.plist

  integration:
    name: Real pf integration (disposable VM)
    needs: offline
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install, probe, rollback, boot re-apply, recover, uninstall
        run: sudo -E bash macos/ci/integration.sh
      - name: NetGuard logs on failure
        if: failure()
        run: |
          sudo cat /Library/NetGuard/netguard.log /Library/NetGuard/daemon.err.log 2>/dev/null | tail -n 200 || true
          sudo /sbin/pfctl -a 'com.apple/zz.NetGuard' -sr 2>/dev/null || true
